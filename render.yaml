services:
  - type: web
    name: horilla-hrms
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /login
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: TIME_ZONE
        value: "Asia/Kolkata"
      - key: WEB_CONCURRENCY
        value: "1"
      # Render injects PORT automatically; entrypoint.sh already reads it.
      - key: DATABASE_URL
        sync: false # set manually — a publicly reachable Postgres (Render Postgres
        # or another managed instance). Your local Postgres on localhost is NOT
        # reachable from Render and cannot be used here.
      - key: LINKEDIN_CLIENT_ID
        sync: false # set manually — LinkedIn OAuth app client ID
      - key: LINKEDIN_CLIENT_SECRET
        sync: false # set manually — LinkedIn OAuth app client secret
      - key: LINKEDIN_REDIRECT_URI
        sync: false # set manually — must match the redirect URI configured
        # in the LinkedIn OAuth app, e.g. https://<service>.onrender.com/recruitment/check-linkedin
